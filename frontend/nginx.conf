map $http_user_agent $is_bot {
  default 0;
  ~*(facebookexternalhit|twitterbot|whatsapp|telegrambot|slackbot|linkedinbot|discordbot|googlebot|bingbot) 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 500m;

  location = /api/v1/notifications/stream {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /media/ {
    proxy_pass http://api:8000;
  }

    location ~ "^/watch/([a-f0-9]{24})$" {
    if ($is_bot) {
      rewrite ^/watch/(.*)$ /__share/$1 last;
    }
    try_files /index.html =404;
  }

  location /__share/ {
    internal;
    proxy_pass http://api:8000/share/watch/;
  }

  location = /sitemap.xml { proxy_pass http://api:8000; }
  location = /robots.txt  { proxy_pass http://api:8000; }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}